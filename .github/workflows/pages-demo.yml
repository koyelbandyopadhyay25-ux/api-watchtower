name: Build and publish GitHub Pages demo

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Push events for any branch are harmless; only GitHub's configured default branch publishes.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend-only demo for project Pages path
        run: npm run build -w @watchtower/web
        env:
          VITE_DEMO_MODE: 'true'
          VITE_BASE_PATH: /api-watchtower/
          VITE_REPOSITORY_URL: https://github.com/${{ github.repository }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
